name: Bug report
description: Something in Steno behaves incorrectly.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please do not attach recordings, transcripts, or screenshots that contain
        confidential meeting content. Redact anything you paste.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you expect, and what happened instead?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start an onsite recording
        2. ...
        3. ...
    validations:
      required: true

  - type: dropdown
    id: mode
    attributes:
      label: Recording mode
      options:
        - online (Teams / Zoom / Meet)
        - onsite (room recording)
        - not related to a recording
    validations:
      required: true

  - type: input
    id: steno-version
    attributes:
      label: Steno version and build
      description: >-
        Einstellungen → Updates shows both ("Installierte Version"), as does
        Finder's Get Info. The build number matters: two zips can carry the same
        version.
      placeholder: "0.1.0 (18)"
    validations:
      required: true

  - type: dropdown
    id: update-channel
    attributes:
      label: How this copy was installed
      description: >-
        Release candidates and builds made from source can differ from a
        published release, which is worth knowing before anything else is
        investigated.
      options:
        - Downloaded from a release, updated in-app (Sparkle)
        - Downloaded from a release, never updated
        - Release candidate (a version with -rc in it)
        - Built from source
    validations:
      required: true

  - type: input
    id: macos-version
    attributes:
      label: macOS version and Mac model
      placeholder: "macOS 15.4, MacBook Pro M3"
    validations:
      required: true

  - type: textarea
    id: meta-json
    attributes:
      label: meta.json of the affected recording
      description: >-
        From the meeting folder. Remove the `title` field and anything else
        confidential; `state`, `mode`, `error`, `channels`, and `input` are the
        interesting parts.
      render: json

  - type: textarea
    id: logs
    attributes:
      label: Log output
      description: >-
        `log show --predicate 'subsystem == "de.21m.steno"' --last 30m --info`
      render: shell
